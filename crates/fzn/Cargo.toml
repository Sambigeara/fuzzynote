[package]
name = "fzn"
description = "fuzzynote: a blank page that remembers what you wrote."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fzn-engine = { path = "../fzn-engine" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "1"
getrandom = "0.3"
ratatui = "0.30"
# How many columns a letter takes, as ratatui counts them when it draws; it brings it in already.
unicode-width = "0.2"
# Where one letter as it is drawn ends, an accent with its letter, as ratatui splits text when it
# draws; it brings it in already.
unicode-segmentation = "1"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
# TLS to a relay behind a proxy that has it, named as wss://. Its cryptography from ring, which
# builds with a C compiler alone where rustls's default wants cmake as well; and the roots the
# browsers trust built in, so a static binary trusts the same wherever it runs.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "1"
# Names the page in a directory given with --web, as the build names the one it carries. The
# engine already brings it in.
sha2.workspace = true

# For the offset of the local clock from UTC, which the standard library cannot say.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
# Gzips the page's files as they are built into fzn, so that the relay sends them small with no
# compressor of its own. Pure Rust, and never in the binary. sha2 names the page, as the relay
# names a directory given with --web.
flate2 = "1"
sha2.workspace = true

[dev-dependencies]
# For reading back what the relay sent gzipped.
flate2 = "1"
