[workspace]
resolver = "3"
members = ["crates/fzn-engine", "crates/fzn", "crates/fzn-web"]

[workspace.package]
version = "0.46.2"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/Sambigeara/fuzzynote"

[workspace.dependencies]
unicode-segmentation = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Sealing. Pure Rust, and built for wasm32 with no features that reach for the machine: the
# nonce comes from the host, so nothing here needs its own source of randomness.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
base64 = "0.22"

# Deriving a key is deliberately slow, and unoptimised it is slower still; tests derive keys.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# One profile for the binary and the wasm: whole-program optimisation and no symbols. A release
# build takes twice as long as a plain one, and nothing of the dev profile changes. Not
# panic = "abort", which would make a panic in one of the relay's connections the end of the
# relay, and not opt-level = "z", which halves the wasm but is slower on the hot loops a
# keystroke runs.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
