# Builds a release when a tag v* is pushed: the page once, the binary for each platform with
# the page built in, and a release on GitHub with the archives, their checksums and install.sh,
# published as the latest, so that install.sh installs it at once. The tag is the decision to
# release; each binary has been run on its platform before anything is published, and a build
# that fails publishes nothing. Run by hand (workflow_dispatch), on any branch or tag, it builds
# everything and publishes nothing, which is the rehearsal: the archives are left as the run's
# artifacts. What each job runs is release.sh, the same script a release built by hand runs, so
# the two cannot drift.
#
# Every action is pinned to a commit, with its version beside it, since a moved tag could
# change the binaries; and nothing is restored from a cache, which a run on another ref could
# have written.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN: 0.2.129

jobs:
  page:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}

      - name: Build the page
        run: web/build.sh

      - name: Sizes
        run: ls -l web/pkg >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: page
          path: web/pkg
          if-no-files-found: error

  binary:
    needs: page
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: page
          path: web/pkg

      - name: Build and package
        env:
          FZN_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          FZN_PAGE_BUILT: 1
        run: sh release.sh --target ${{ matrix.target }}

      - name: Check it runs
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: tar -xzf dist/download/v*/fzn-${{ matrix.target }}.tar.gz -C "$RUNNER_TEMP" && "$RUNNER_TEMP/fzn-${{ matrix.target }}/fzn" --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fzn-${{ matrix.target }}
          path: dist/download
          if-no-files-found: error

  release:
    needs: binary
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: page
          path: web/pkg

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fzn-*
          path: dist/download
          merge-multiple: true

      - name: Package the page and sum everything
        env:
          FZN_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          FZN_PAGE_BUILT: 1
        run: sh release.sh --page

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/download
          if-no-files-found: error

      # Only for a pushed tag: a run by hand publishes nothing, whatever ref it was started on.
      - name: Publish the release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --latest --verify-tag --title "fzn ${TAG#v}" \
            --repo "$GITHUB_REPOSITORY" \
            --notes "Install with \`curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh | sh\`" \
            dist/download/"$TAG"/* install.sh
