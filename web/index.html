<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="fzn-build" content="">
<meta name="theme-color" content="#f8f7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161514" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>fzn</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">
<main id="page">
  <form id="unlock" hidden>
    <div class="above"><label id="for" for="secret">The passphrase for <b id="space"></b></label></div>
    <div class="top">
      <input id="secret" class="field" type="password" autocomplete="current-password" enterkeyhint="go" required>
    </div>
    <p id="unlocking">Asked once on this device. The notes cannot be read without it.</p>
    <button id="open" class="word" type="submit">open</button>
  </form>
  <div id="above" class="above">
    <nav id="path" aria-label="Where you are" hidden></nav>
    <aside id="here" aria-label="The note you are in" hidden></aside>
  </div>
  <div id="top" class="top">
    <input id="line" class="field" type="text" autocomplete="off" autocapitalize="sentences"
           spellcheck="false" enterkeyhint="enter" aria-label="Type to find or to write">
    <span id="dates"></span>
    <button id="clear" type="button" tabindex="-1" aria-label="Clear the line" hidden>×</button>
    <button id="go-in" class="chev" type="button" tabindex="-1" aria-label="Go in" hidden>›</button>
  </div>
  <p id="empty" hidden>Type a thought. Enter keeps it.</p>
  <div id="lower">
    <ol id="list" aria-label="Notes"></ol>
    <aside id="pane" aria-label="The body of what the cursor is on"
      ><div id="pane-head" hidden></div><div id="pane-body"></div></aside>
  </div>
</main>
<div id="buffer" role="dialog" aria-label="The note under the cursor" hidden>
  <div id="sheet"></div>
  <div id="sheet-foot"></div>
</div>
<ol id="offer" role="listbox" aria-label="What completes the word" hidden></ol>
<footer id="foot">
  <div id="hints"></div>
  <div id="way"></div>
  <div id="said">
    <span id="status" role="status"></span>
    <span id="trouble" hidden>The passphrase does not open this space. <button id="again" class="word" type="button">Type it again.</button></span>
    <span id="sync" hidden></span>
    <button id="passphrase" class="word" type="button" hidden>passphrase</button>
  </div>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
